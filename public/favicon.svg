<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x1="-20%" y1="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#090a10" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#grad)" stroke-width="2" />
  <g filter="url(#glow)">
    <!-- QR Corner Top Left -->
    <rect x="14" y="14" width="14" height="14" rx="3" stroke="#8b5cf6" stroke-width="3" fill="none" />
    <rect x="18" y="18" width="6" height="6" rx="1" fill="#8b5cf6" />
    
    <!-- QR Corner Top Right -->
    <rect x="36" y="14" width="14" height="14" rx="3" stroke="#6366f1" stroke-width="3" fill="none" />
    <rect x="40" y="18" width="6" height="6" rx="1" fill="#6366f1" />
    
    <!-- QR Corner Bottom Left -->
    <rect x="14" y="36" width="14" height="14" rx="3" stroke="#06b6d4" stroke-width="3" fill="none" />
    <rect x="18" y="40" width="6" height="6" rx="1" fill="#06b6d4" />
    
    <!-- Center dots -->
    <circle cx="36" cy="36" r="3" fill="#a855f7" />
    <circle cx="44" cy="44" r="3" fill="#06b6d4" />
    <rect x="42" y="34" width="4" height="4" rx="1" fill="#6366f1" />
    <rect x="34" y="44" width="4" height="4" rx="1" fill="#38bdf8" />
  </g>
</svg>